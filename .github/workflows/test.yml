name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-clean:
    name: check mode, clean locales (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: kaeris
        uses: ./
        with:
          mode: check
          source: test/fixtures/good/en.json
          languages: de,fr
          sarif-file: kaeris.sarif
      - name: Outputs say clean
        shell: bash
        env:
          EXIT: ${{ steps.kaeris.outputs.check-exit-code }}
          MISSING: ${{ steps.kaeris.outputs.missing }}
          PH: ${{ steps.kaeris.outputs.placeholder-issues }}
        run: |
          echo "check-exit-code=$EXIT missing=$MISSING placeholder-issues=$PH"
          test "$EXIT" = "0"
          test "$MISSING" = "0"
          test "$PH" = "0"
          test -s kaeris.sarif

  check-broken:
    name: check mode, broken locale fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: kaeris
        uses: ./
        continue-on-error: true
        with:
          mode: check
          source: test/fixtures/broken/en.json
          languages: de
      - name: Step failed and outputs count the faults
        shell: bash
        env:
          OUTCOME: ${{ steps.kaeris.outcome }}
          EXIT: ${{ steps.kaeris.outputs.check-exit-code }}
          MISSING: ${{ steps.kaeris.outputs.missing }}
          PH: ${{ steps.kaeris.outputs.placeholder-issues }}
        run: |
          echo "outcome=$OUTCOME check-exit-code=$EXIT missing=$MISSING placeholder-issues=$PH"
          test "$OUTCOME" = "failure"
          test "$EXIT" = "1"
          test "$MISSING" = "1"
          test "$PH" = "1"
